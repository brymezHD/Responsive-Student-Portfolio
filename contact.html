<section class="wrap narrow page-head"><h1>Contact me</h1><p>Have a question or an opportunity? Fill in the form and I'll reply within a few days. You can also email <a href="mailto:you@example.com">you@example.com</a>.</p></section>
<section class="wrap narrow">
<form id="contact-form" novalidate>
<div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-error"><span class="err" id="name-error"></span></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error"><span class="err" id="email-error"></span></div>
<div class="field"><label for="phone">Phone number (digits only)</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" aria-describedby="phone-error"><span class="err" id="phone-error"></span></div>
<div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="6" aria-describedby="message-error"></textarea><span class="err" id="message-error"></span></div>
<button class="btn" type="submit">Send message</button>
</form>
<div id="form-status" class="msg" tabindex="-1"></div>
</section>

</main>
